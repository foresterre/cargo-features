[package]
name = "cargo-features"
authors = ["Martijn Gribnau <garm@ilumeo.com>"]
version = "1.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"
documentation = "https://docs.rs/crate/cargo-features"
repository = "https://github.com/foresterre/cargo-features"
keywords = ["cargo", "features"]
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.1.1"
cargo_metadata = "0.23.1"
